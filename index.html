<!doctype html>

  <head>
    <meta charset="UTF-8" />
    <script>
      // Polyfill window.fetch setter to prevent extensions like frame_ant from throwing:
      // "TypeError: Cannot set property fetch of #<Window> which has only a getter"
      (function() {
        try {
          var _fetch = window.fetch;
          Object.defineProperty(window, 'fetch', {
            get: function() { return _fetch; },
            set: function(val) { _fetch = val; },
            configurable: true,
            enumerable: true
          });
        } catch (e) {
          try {
            var proto = Object.getPrototypeOf(window);
            if (proto) {
              Object.defineProperty(proto, 'fetch', {
                get: function() { return _fetch; },
                set: function(val) { _fetch = val; },
                configurable: true,
                enumerable: true
              });
            }
          } catch (e2) {}
        }

        window.addEventListener('error', function(event) {
          if (
            (event.filename && (
              event.filename.indexOf('chrome-extension://') !== -1 ||
              event.filename.indexOf('frame_ant') !== -1
            )) ||
            (event.message && event.message.indexOf('fetch of #<Window>') !== -1)
          ) {
            event.preventDefault();
            event.stopImmediatePropagation();
            return true;
          }
        }, true);
      })();
    </script>
